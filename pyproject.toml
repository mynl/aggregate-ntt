[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "aggregate-ntt"
# The version is written once, in Cargo.toml; maturin fills it in from there.
dynamic = ["version"]
description = "Compiled engine for exact bounded discrete compound distributions, an optional accelerator for the aggregate library."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Stephen J. Mildenhall", email = "mynl@me.com" },
]
maintainers = [
    { name = "Stephen J. Mildenhall", email = "mynl@me.com" },
]
keywords = [
    "actuarial",
    "insurance",
    "aggregate loss",
    "compound distribution",
    "number theoretic transform",
    "chinese remainder theorem",
    "exact arithmetic",
    "rust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.7,<2",
    "pytest>=7",
    "pytest-xdist>=3",
    "ruff>=0.6",
    # `aggregate` is deliberately NOT listed here, even though the conformance
    # suite needs it. The exact-compound surface this engine accelerates
    # (`aggregate.ntt`) is newer than anything on PyPI, so a version
    # constraint here would be unresolvable. Install it editable from a local
    # checkout instead:
    #
    #     uv pip install -e <path to the aggregate checkout>
    #
    # The conformance tests `importorskip` it, so the suite is green without
    # it and the engine's own seam tests still run. The runtime dependency
    # must stay one way regardless: this package never imports `aggregate`.
]

[project.urls]
Homepage = "https://github.com/mynl/aggregate-ntt"
Repository = "https://github.com/mynl/aggregate-ntt"

[tool.maturin]
# Mixed layout: a thin Python package in `python/` wrapping the compiled
# `_engine` module, so the public surface, the protocol version and the
# docstrings live in Python where they are readable and testable.
python-source = "python"
module-name = "aggregate_ntt._engine"
features = ["pyo3/extension-module"]

[tool.uv]
# uv caches this project's metadata keyed on these files. The version is
# dynamic and lives in Cargo.toml, so without that key a bump could leave
# `uv lock` and `uv run` carrying the old version.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 79
